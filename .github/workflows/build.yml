name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlnew:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python sqlnew/build.py
      - run: python -m unittest discover -s sqlnew -p "test_*.py" -v
      - run: python sqlnew/exercise_dev021.py
      - name: Validate scalar build
        env:
          SQLNEW_DISABLE_SIMD: '1'
        run: python sqlnew/build.py
      - run: python -m unittest discover -s sqlnew -p "test_*.py" -v
      - run: python sqlnew/exercise_dev021.py

  sqlite-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y build-essential tcl-dev
      - name: Required core development checks
        run: |
          mkdir -p build/core-devtest
          cd build/core-devtest
          ../../configure --dev
          make -j2 tclextension
          sudo tclsh ../../tool/buildtclext.tcl --install-only
          make -j2 devtest
